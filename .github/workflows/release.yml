name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type applied to affected packages that already existed at the previous release'
        required: true
        type: choice
        options: [patch, minor, major, prepatch, preminor, premajor, prerelease]
      preid:
        description: 'Pre-release identifier (only used with a pre* bump type)'
        required: true
        type: choice
        options: [none, alpha, beta]
        default: none
      dry_run:
        description: 'Compute the bump and verify the build only — no commit, tag, release, or publish'
        required: true
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # main requires a PR + a passing "check" status via repository
          # rulesets; the default GITHUB_TOKEN can't bypass that (bypass is
          # scoped to the Admin repository role). RELEASE_TOKEN is a
          # fine-grained PAT owned by an account with that role, so pushes
          # and tag creation below go through under its identity instead.
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Bump affected packages
        env:
          PLAN: ${{ runner.temp }}/bump-plan.json
        run: |
          extra=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            extra+=(--dry-run)
          fi
          if [ "${{ inputs.preid }}" = "none" ]; then
            bun run bump --bump ${{ inputs.bump }} --plan-out "$PLAN" "${extra[@]}"
          else
            bun run bump --bump ${{ inputs.bump }} --preid ${{ inputs.preid }} --plan-out "$PLAN" "${extra[@]}"
          fi

      - name: Allocate release tag
        id: tag
        run: |
          today=$(date -u +%Y%m%d)
          n=1
          while git rev-parse -q --verify "refs/tags/v${today}.${n}" >/dev/null; do
            n=$((n + 1))
          done
          echo "value=v${today}.${n}" >> "$GITHUB_OUTPUT"

      - name: Verify the tree is releasable
        run: |
          bun run typecheck
          bun run build
          bun run test

      - name: Commit, tag, and push
        if: ${{ !inputs.dry_run }}
        env:
          PLAN: ${{ runner.temp }}/bump-plan.json
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u -- packages stores providers protocols extensions transports
          if git diff --cached --quiet; then
            echo "No version changes. Tagging the current commit so first publishes still ship."
            git tag "$TAG"
            git push origin "$TAG"
          else
            git commit -m "chore: bump affected package versions"
            git tag "$TAG"
            git push origin HEAD:main
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PLAN: ${{ runner.temp }}/bump-plan.json
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          notes=$(mktemp)
          {
            echo "## Packages"
            echo
            changed=$(jq -r '.bumps[] | select(.from != .to) | "| `\(.name)` | \(.from) | \(.to) |"' "$PLAN")
            if [ -n "$changed" ]; then
              echo "| Package | From | To |"
              echo "| --- | --- | --- |"
              echo "$changed"
              echo
            fi
            first=$(jq -r '.bumps[] | select(.from == .to) | "| `\(.name)` | \(.to) |"' "$PLAN")
            if [ -n "$first" ]; then
              echo "### First publish"
              echo
              echo "These packages were not in the previous release. Their current version is published as-is."
              echo
              echo "| Package | Version |"
              echo "| --- | --- |"
              echo "$first"
              echo
            fi
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body
          } > "$notes"
          gh release create "$TAG" --title "$TAG" --notes-file "$notes"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          PLAN: ${{ runner.temp }}/bump-plan.json
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          {
            echo "🔍 Dry run — would tag **${TAG}**. Build/test passed, nothing committed, tagged, released, or published."
            echo
            changed=$(jq -r '.bumps[] | select(.from != .to) | "| `\(.name)` | \(.from) | \(.to) |"' "$PLAN")
            if [ -n "$changed" ]; then
              echo "| Package | From | To |"
              echo "| --- | --- | --- |"
              echo "$changed"
              echo
            fi
            first=$(jq -r '.bumps[] | select(.from == .to) | "| `\(.name)` | \(.to) |"' "$PLAN")
            if [ -n "$first" ]; then
              echo "### First publish"
              echo
              echo "| Package | Version |"
              echo "| --- | --- |"
              echo "$first"
              echo
            fi
            echo "Re-run with \`dry_run: false\` to actually release."
          } >> "$GITHUB_STEP_SUMMARY"
