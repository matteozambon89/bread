name: Example check

on:
  pull_request:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Root build is packages-only; the loop is the example `bread build`.
      - run: bun run build
      - name: bread build every example
        run: |
          for d in examples/*/; do
            echo "→ $d"
            (cd "$d" && bun run build) || exit 1
          done
